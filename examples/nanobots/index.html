<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>milktea.txt</title>
<link rel="stylesheet" href="milktea-symbols.css">
<style>
  body { background:#000; margin:0; padding:24px; }
  pre {
    font-family: 'Milktea Symbols', monospace;
    font-size: 48px;
    line-height: 1;
    color: #fff;
    margin: 0;
    white-space: pre;
    /* One character is one cell of the Symbols for Legacy Computing grid,
       and the font draws a cell as a square: one em wide, one em tall. The
       art is a FIGfont, though, and terminal cells are twice as tall as they
       are wide, so stretch the block vertically to get the geometry the art
       was drawn for. Scaling from the top left leaves the padding alone. */
    transform: scaleY(2);
    transform-origin: top left;
  }
</style>
</head>
<body>
<pre id="art">

 🭋█🭛🭅🭡🭋█🭛🭋█🭛🭋█🭛  🭋████🭪  🭋█🭛  🭋█🬝🬎🬎🬎🭙🭋█🭛 🭋█🭛

</pre>
</body>
</html>
