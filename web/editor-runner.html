<!doctype html><html lang="en"><meta charset="utf-8"><style>
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#111318}
canvas {display:block;width:100%;height:100%;outline:none}
</style><canvas aria-label="Live milktea program"></canvas>
<script type="importmap">{"imports":{"milktea":"./bindings.js"}}</script>
<script type="module">
import {mount} from './bindings.js';
let app, generation=0;
const report=(type,detail)=>parent.postMessage({source:'milktea-editor',type,detail},location.origin);
addEventListener('error',event=>report('error',event.error?.stack || event.message));
addEventListener('unhandledrejection',event=>report('error',event.reason?.stack || String(event.reason)));
addEventListener('message',async event=>{
  if (event.source!==parent || event.origin!==location.origin || event.data?.source!=='milktea-editor') return;
  const current=++generation;
  const url=URL.createObjectURL(new Blob([event.data.code],{type:'text/javascript'}));
  try {
    const {default:program}=await import(url);
    if (current!==generation) return;
    if (!program || typeof program.view!=='function') throw new TypeError('Export a default program with init, update, and view');
    app?.stop();
    const next=await mount(document.querySelector('canvas'),program,{
      fontSize:event.data.fontSize || 16,
      onError:error=>report('error',error.stack || error.message),
      onQuit:()=>report('stopped','Program stopped'),
      host:{log:message=>report('log',message)}});
    if (current!==generation) {next.stop();return;}
    app=next;
    window.app=app;
    report('ready','Running');
  } catch(error) {report('error',error.stack || error.message);} finally {URL.revokeObjectURL(url);}
});
report('loaded','Editor ready');
</script></html>
